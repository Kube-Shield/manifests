apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailhog
  labels:
    app: mailhog
spec:
  ingressClassName: nginx
  rules:
    - host: mailhog.crapi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mailhog
                port:
                  number: 8025
