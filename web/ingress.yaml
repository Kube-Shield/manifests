apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crapi-web
  labels:
    app: crapi-web
spec:
  ingressClassName: nginx
  rules:
    - host: crapi.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: crapi-web
                port:
                  number: 80
