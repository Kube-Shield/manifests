apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway-service
        image: crapi/gateway-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8087
        envFrom:
          - configMapRef:
              name: gateway-service-configmap
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: "100m"
            memory: 128Mi
        readinessProbe:
          tcpSocket:
            port: 8087
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8087
          initialDelaySeconds: 20
          periodSeconds: 20
