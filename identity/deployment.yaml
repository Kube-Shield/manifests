apiVersion: apps/v1
kind: Deployment
metadata:
  name: crapi-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crapi-identity
  template:
    metadata:
      labels:
        app: crapi-identity
    spec:
      serviceAccountName: crapi-wait-for
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: groundnuty/k8s-wait-for:no-root-v2.0
          imagePullPolicy: IfNotPresent
          args:
            - "service"
            - "postgresdb"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: jwt-key-secret
          secret:
            secretName: jwt-key-secret
      containers:
        - name: crapi-identity
          image: crapi/crapi-identity:v1
          volumeMounts:
            - mountPath: "/.keys"
              name: jwt-key-secret
              readOnly: true
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
          envFrom:
              - configMapRef:
                  name: crapi-identity-configmap
              - secretRef:
                  name: crapi-identity-secret
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: "500m"
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
